# Use environment variables for DB credentials to avoid committing secrets
# Environment variables supported: DB_URL, DB_USERNAME, DB_PASSWORD

server.port=8085

spring.application.name=insurance-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
